<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 · 微信自动回复</title>
    <style>
        :root {
            --accent: #6366f1; --accent-2: #8b5cf6;
            --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: var(--font-ui);
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            background: linear-gradient(135deg, #eef1f8 0%, #e6e9f5 100%);
            color: #1a2233; padding: 20px;
        }
        .card {
            width: 100%; max-width: 380px;
            background: #fff; border-radius: 18px;
            box-shadow: 0 8px 40px rgba(16,24,40,0.12);
            padding: 36px 32px;
        }
        .logo {
            width: 56px; height: 56px; border-radius: 16px;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            display: flex; align-items: center; justify-content: center;
            font-size: 28px; margin: 0 auto 18px;
        }
        h1 { font-size: 20px; text-align: center; margin-bottom: 6px; }
        .sub { text-align: center; color: #8a94a6; font-size: 13px; margin-bottom: 26px; }
        label { display: block; font-size: 13px; color: #4a5568; margin-bottom: 8px; }
        input[type=password] {
            width: 100%; padding: 12px 14px; font-size: 15px;
            border: 1px solid #e4e8ee; border-radius: 12px;
            background: #f5f7fa; outline: none; transition: 0.2s;
        }
        input[type=password]:focus { border-color: var(--accent); background: #fff; }
        button {
            width: 100%; margin-top: 20px; padding: 12px;
            font-size: 15px; font-weight: 600; color: #fff; border: none;
            border-radius: 12px; cursor: pointer;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            transition: 0.2s;
        }
        button:hover { opacity: 0.92; }
        .error {
            margin-top: 16px; padding: 10px 14px; font-size: 13px;
            color: #ef4444; background: #fef2f2; border-radius: 10px; text-align: center;
        }
        .hint { margin-top: 20px; font-size: 12px; color: #8a94a6; text-align: center; line-height: 1.6; }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">🤖</div>
        <h1>微信自动回复控制台</h1>
        <div class="sub">请输入访问密码</div>
        <form method="POST" action="/login">
            <label for="password">访问密码</label>
            <input type="password" id="password" name="password" autofocus autocomplete="current-password" placeholder="输入密码">
            <button type="submit">进入控制台</button>
        </form>
        {% if error %}<div class="error">{{ error }}</div>{% endif %}
        <div class="hint">首次启动会自动生成密码，见运行日志或 config.json 的 server.password</div>
    </div>
</body>
</html>
