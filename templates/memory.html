{% extends "base.html" %}
{% block title %}记忆管理 - 微信自动回复{% endblock %}

{% block content %}
<div class="pixel-card">
    <div class="d-flex align-center gap-2 mb-3">
        <i class="bi bi-database"></i>
        <h2 class="pixel-title">记忆统计</h2>
    </div>
    <div id="stats" class="mb-3">
        <div class="pixel-muted">加载中...</div>
    </div>
</div>

<div class="pixel-card">
    <div class="d-flex align-center gap-2 mb-3">
        <i class="bi bi-people"></i>
        <h2 class="pixel-title">联系人记忆</h2>
    </div>
    <div id="contacts-list">
        <div class="pixel-muted">加载中...</div>
    </div>
</div>

<div class="pixel-card" id="chat-panel" style="display:none;">
    <div class="d-flex align-center gap-2 mb-3">
        <i class="bi bi-chat-dots"></i>
        <h2 class="pixel-title" id="chat-title">对话记录</h2>
        <span class="pixel-badge pixel-badge-green ml-auto" id="chat-count"></span>
    </div>
    <div id="chat-messages" style="max-height: 400px; overflow-y: auto; padding: 10px; background: rgba(0,0,0,0.2); border-radius: 8px; margin-bottom: 10px;">
    </div>
    <div class="d-flex gap-2">
        <button class="pixel-btn pixel-btn-blue" onclick="loadMessages(currentContact)">
            <i class="bi bi-arrow-clockwise"></i> 刷新
        </button>
        <button class="pixel-btn pixel-btn-red" onclick="clearMemory(currentContact)">
            <i class="bi bi-trash"></i> 清除此人记忆
        </button>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
let currentContact = null;

async function loadStats() {
    try {
        const d = await api('/api/memory/stats');
        document.getElementById('stats').innerHTML = `
            <div class="d-flex gap-3 flex-wrap">
                <div class="pixel-card" style="flex:1; min-width:120px; text-align:center; padding:15px;">
                    <div style="font-size:28px; color:#34d399;">${d.total_messages}</div>
                    <div class="pixel-muted" style="font-size:12px;">总消息数</div>
                </div>
                <div class="pixel-card" style="flex:1; min-width:120px; text-align:center; padding:15px;">
                    <div style="font-size:28px; color:#60a5fa;">${d.total_contacts}</div>
                    <div class="pixel-muted" style="font-size:12px;">联系人数</div>
                </div>
                <div class="pixel-card" style="flex:1; min-width:120px; text-align:center; padding:15px;">
                    <div style="font-size:28px; color:#fbbf24;">${d.db_size_kb} KB</div>
                    <div class="pixel-muted" style="font-size:12px;">数据库大小</div>
                </div>
            </div>
        `;
    } catch(e) {
        document.getElementById('stats').innerHTML = '<div class="pixel-muted">加载失败</div>';
    }
}

async function loadContacts() {
    try {
        const d = await api('/api/memory/contacts');
        const list = document.getElementById('contacts-list');
        if (!d.contacts || d.contacts.length === 0) {
            list.innerHTML = '<div class="pixel-muted">暂无联系人记忆数据</div>';
            return;
        }
        list.innerHTML = d.contacts.map(c => `
            <div class="d-flex align-center gap-2 mb-2 pixel-card" style="padding:12px; cursor:pointer;" onclick="loadMessages('${c.contact}')">
                <div style="width:40px; height:40px; border-radius:50%; background:linear-gradient(135deg, #6366f1, #8b5cf6); display:flex; align-items:center; justify-content:center; color:white; font-weight:bold; font-size:16px;">
                    ${c.contact.charAt(0)}
                </div>
                <div style="flex:1;">
                    <div style="font-weight:bold; font-size:16px;">${c.contact}</div>
                    <div class="pixel-muted" style="font-size:12px;">
                        ${c.message_count} 条消息 · 最近: ${c.last_seen || '未知'}
                    </div>
                </div>
                <span class="pixel-badge pixel-badge-blue">${c.message_count}</span>
            </div>
        `).join('');
    } catch(e) {
        document.getElementById('contacts-list').innerHTML = '<div class="pixel-muted">加载失败</div>';
    }
}

async function loadMessages(contact) {
    currentContact = contact;
    document.getElementById('chat-panel').style.display = '';
    document.getElementById('chat-title').textContent = `${contact} 的对话记录`;

    try {
        const d = await api(`/api/memory/${contact}/messages?limit=100`);
        const div = document.getElementById('chat-messages');
        document.getElementById('chat-count').textContent = `${d.messages.length} 条`;

        if (d.messages.length === 0) {
            div.innerHTML = '<div class="pixel-muted" style="text-align:center; padding:20px;">暂无对话记录</div>';
            return;
        }

        div.innerHTML = d.messages.map(m => `
            <div style="margin-bottom:8px; display:flex; ${m.role === 'user' ? '' : 'justify-content:flex-end;'}">
                <div style="max-width:70%; padding:8px 12px; border-radius:12px; font-size:14px;
                    ${m.role === 'user'
                        ? 'background:#1e293b; color:#e2e8f0;'
                        : 'background:#3730a3; color:#e0e7ff;'
                    }">
                    <div style="font-size:11px; opacity:0.6; margin-bottom:2px;">
                        ${m.role === 'user' ? '👤 ' + contact : '🤖 机器人'} · ${m.time || ''}
                    </div>
                    <div style="white-space:pre-wrap; word-break:break-word;">${m.content}</div>
                </div>
            </div>
        `).join('');

        div.scrollTop = div.scrollHeight;
    } catch(e) {
        document.getElementById('chat-messages').innerHTML = '<div class="pixel-muted">加载失败</div>';
    }
}

async function clearMemory(contact) {
    if (!confirm(`确定要清除 ${contact} 的所有记忆吗？此操作不可恢复。`)) return;
    try {
        await api(`/api/memory/${contact}`, {method:'DELETE'});
        showAlert(`已清除 ${contact} 的记忆`, 'success');
        document.getElementById('chat-panel').style.display = 'none';
        loadStats();
        loadContacts();
    } catch(e) {
        showAlert('清除失败', 'error');
    }
}

document.addEventListener('DOMContentLoaded', () => {
    loadStats();
    loadContacts();
});
</script>
{% endblock %}
